name: Deploy SmartQuiz API

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 192.168.102.25
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/smartquiz_saas_sandbox/smartquizapi
            git pull origin main
            docker compose down
            docker compose up -d --build